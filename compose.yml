
services:
  # ============================================
  # POSTGRESQL DATABASE
  # ============================================
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${APP_NAME:-recruitmentService}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # ============================================
  # REDIS CACHE
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-recruitmentService}-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # ============================================
  # SPRING BOOT APPLICATION
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-recruitmentService}-app
    ports:
      - "8082:8080"
      - "5006:5005"      # Debug port
      - "35730:35729"    # LiveReload port
    volumes:
#      - ./src:/app/src:delegated  # delegated > cached (macOS/WSL2)
#      - ./pom.xml:/app/pom.xml:delegated
#      - maven-cache:/root/.m2/repository  # Match Dockerfile cache id
      # Bind mount source code for hot reload
      - ./src:/app/src:cached
      - ./pom.xml:/app/pom.xml:cached
      # Exclude target directory
      - /app/target
    environment:
      - JAVA_OPTS=-Xms256m -Xmx1024m -Dspring.devtools.restart.enabled=true -Dspring.devtools.livereload.enabled=true

      # Spring profiles
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}

      # DevTools
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true

      # Database (use service name 'postgres')
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      # Redis (use service name 'redis')
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

      # JPA
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-true}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}

      # Flyway
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}

      # Logging
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_COM_SOCIAL=${LOGGING_LEVEL_COM_SOCIAL:-DEBUG}

      # JWT Configuration - ADD THIS
      - JWT_SECRET=${JWT_SECRET}

      # Email Configuration
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      # CORS Configuration - ADD THIS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,PATCH,OPTIONS
      - CORS_ALLOWED_HEADERS=*
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_MAX_AGE=3600

      # Eureka
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      # App name cho Eureka
      - SPRING_APPLICATION_NAME=recruitmentService-be



    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

# ============================================
# VOLUMES
# ============================================
#volumes:
#  postgres_data:
#  redis_data:
#  maven-cache:  # Persistent Maven deps
#  notarget:     # Temp target
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  maven-cache:
    driver: local

# ============================================
# NETWORKS (ADDED)
# ============================================
networks:
  app-network:
    name: oneclick-network
    external: true
