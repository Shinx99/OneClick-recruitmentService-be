<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chào mừng Ứng viên - OneClick</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7fa;">
<!-- Header: blue -->
<tr>
    <td style="padding: 40px 20px; text-align: center; background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);">
        <img th:src="${logoUrl}" alt="OneClick">
        <h1 style="color: white;">👋 Chào mừng Ứng viên</h1>
    </td>
</tr>
<!-- Content -->
<tr>
    <td style="padding: 40px 40px; background: white; max-width: 600px; margin: 0 auto;">
        <h2>Chào <strong th:text="${candidateName}"></strong>,</h2>
        <p>Tài khoản ứng viên đã sẵn sàng! Hãy bắt đầu hành trình tìm việc:</p>
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 30px 0;">
            <tr>
                <td style="padding-right: 10px;">
                    <a th:href="${dashboardUrl}" style="background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; padding: 14px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">
                        UPLOAD CV NGAY
                    </a>
                </td>
                <td style="padding-left: 10px;">
                    <a th:href="${frontendUrl + '/jobs'}" style="background: #f7fafc; color: #4a5568; padding: 14px 24px; text-decoration: none; border-radius: 6px; display: inline-block; border: 2px solid #e2e8f0;">
                        TÌM VIỆC LÀM
                    </a>
                </td>
            </tr>
        </table>
    </td>
</tr>
<!-- Support + Footer same -->
</body>
</html>
