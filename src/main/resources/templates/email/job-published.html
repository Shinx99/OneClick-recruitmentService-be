<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tin tuyển dụng Live - OneClick</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7fa;">
<!-- Header: purple -->
<tr>
    <td style="padding: 40px 20px; text-align: center; background: linear-gradient(135deg, #9f7aea 0%, #805ad5 100%);">
        <img th:src="${logoUrl}" alt="OneClick">
        <h1 style="color: white;">🚀 Việc làm Live!</h1>
    </td>
</tr>
<!-- Content -->
<tr>
    <td style="padding: 40px 40px; background: white; max-width: 600px; margin: 0 auto;">
        <h2>"<strong th:text="${jobTitle}"></strong>" đã được đăng thành công</h2>
        <p>Xin chào <strong th:text="${employerName}"></strong>,</p>
        <p>Tin tuyển dụng đã hiển thị công khai. Ứng viên có thể xem và ứng tuyển ngay:</p>
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 30px 0;">
            <tr>
                <td style="text-align: center;">
                    <a th:href="${jobUrl}" style="background: linear-gradient(135deg, #9f7aea, #805ad5); color: white; padding: 16px 32px; text-decoration: none; font-weight: 600; border-radius: 8px;">
                        XEM TIN TUYỂN DỤNG
                    </a>
                </td>
            </tr>
        </table>
        <div style="background: #f0fff4; padding: 20px; border-radius: 8px; border-left: 4px solid #48bb78;">
            <p><strong>⏰ Tips:</strong></p>
            <ul style="color: #38a169;">
                <li>Candidates sẽ thấy job trong 5 phút</li>
                <li>Check <a th:href="${dashboardUrl + '/stats'}">thống kê realtime</a></li>
            </ul>
        </div>
    </td>
</tr>
<!-- Support + Footer -->
</body>
</html>
