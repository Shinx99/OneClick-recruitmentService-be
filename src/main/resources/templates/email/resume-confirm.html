<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CV Upload Success - OneClick</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7fa;">
<!-- Header: orange -->
<tr>
    <td style="padding: 40px 20px; text-align: center; background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);">
        <img th:src="${logoUrl}" alt="OneClick">
        <h1 style="color: white;">📄 CV Ready!</h1>
    </td>
</tr>
<!-- Content -->
<tr>
    <td style="padding: 40px 40px; background: white; max-width: 600px; margin: 0 auto;">
        <h2>CV của <strong th:text="${candidateName}"></strong> đã upload thành công</h2>
        <p>CV đã được lưu trữ an toàn và sẵn sàng match với jobs phù hợp:</p>
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 30px 0;">
            <tr>
                <td style="padding-right: 10px;">
                    <a th:href="${resumeUrl}" style="background: linear-gradient(135deg, #48bb78, #38a169); color: white; padding: 14px 24px; text-decoration: none; border-radius: 6px;">
                        DOWNLOAD CV
                    </a>
                </td>
                <td style="padding-left: 10px;">
                    <a th:href="${dashboardUrl}" style="background: #f7fafc; color: #4a5568; padding: 14px 24px; text-decoration: none; border-radius: 6px; border: 2px solid #e2e8f0;">
                        QUẢN LÝ CVs
                    </a>
                </td>
            </tr>
        </table>
    </td>
</tr>
<!-- Support + Footer -->
</body>
</html>
